<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body { background:black;display:flex;justify-content:center;align-items:center;padding:100px;}
  
   .sun { min-width:100px ;
          min-height: 100px ; 
          background:linear-gradient(to bottom ,yellow ,hwb(39 8% 9% / 0.9176470588235294),hwb(52 54% 7%));
          border-radius: 50%;
          box-shadow:0 0 90px white;
          margin-top:100px
        }
    .orbit{ min-width:300px;
            min-height: 300px;
            background:transparent;
            border-radius:50%; 
           /* border:1px white solid; */
            box-shadow: 0 0 10px white;
            transform:translateX(-83% );
           position:absolute;
            animation-name: rotate;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            margin-top:100px
          }
    @keyframes rotate { 
    
      0% { transform: rotate(0deg);}
      
      100% {transform: rotate(360deg);}
      }
    .planet{ width:50px;
             height: 50px;
             background:linear-gradient(to right, green, hwb(197 50% 5%) ,hwb(0 35% 56%));
             border-radius:50%;
             transform:translate(40px);}
             
  
  </style>
</head>
<body>

  <div class="sun">
    </div>
</div>
   <div class="orbit"> <div class="planet"></div></div>
</body>
</html>
