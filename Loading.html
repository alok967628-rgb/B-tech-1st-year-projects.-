<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box { width:100%; height:400px;background: black;display:flex;justify-content:center;align-items: center;}
.loader {width: 50px;height:50px;border:7px solid white;border-top:grey 7px solid;border-radius: 100px;animation-name:rotate;animation-duration:4s;
      animation-timing-function:linear;animation-iteration-count: infinite;
        }
    @keyframes rotate{
      0%{transform:rotate(0deg);}
      25%{transform:rotate(90deg);}
      50%{transform: rotate(180deg);}
      75%{transform: rotate(270deg);}
      100%{transform:rotate(360deg);}
      }
         </style>
</head>
<body>
<div class="box">
<div class="loader">
  </div>
</div>
</body>
</html>
